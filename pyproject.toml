[project]
name = "autonomousdr"
version = "0.1.0"
description = "Autonomous multi-cloud disaster recovery system (UCP FYP 2026-27)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "influxdb-client>=1.47",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pgvector>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.120",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]
# Installed by the AI role only. torch / torch-geometric are NOT here on purpose:
# install those per Week 14 with the right CUDA/CPU wheel for your machine.
ml = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pyod>=2.0",
    "networkx>=3.4",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "api", "ml"]

# ---------------------------------------------------------------------------
# Lint / format.  One config, no arguments about style ever again.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["core", "api"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "api/tests", "ml/tests", "scripts/tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.coverage.run]
source = ["core", "api"]
omit = ["*/tests/*"]
